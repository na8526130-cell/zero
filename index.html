    <script>
      // 起動画面が出る前に保存済みテーマを即座に反映し、白いフラッシュを防ぐ
      (function() {
        try {
          var mode = localStorage.getItem('kaito_theme_mode') || localStorage.getItem('themeMode');
          var isDark = mode === 'dark' || (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || mode !== 'light';
          if (isDark) {
            document.documentElement.classList.add('dark', 'dark-theme');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark', 'dark-theme');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (_) {}
      })();

    <style id="site-intro-styles">
      /* ============================================================
         YouTube Cinematic Next-Gen Startup Intro (Muratube Enhanced)
         ============================================================ */
      #site-intro {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #08080a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
      }

      /* Light mode adaptation */
      html:not(.dark):not(.dark-theme) #site-intro {
        background: #ffffff;
        color: #0f0f12;
      }

      /* Seamless Burst Transition on Data Ready */
      #site-intro.is-bursting {
        animation: intro-burst-exit 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        pointer-events: none;
      }

      #site-intro.is-hidden {
        opacity: 0;
        transform: scale(1.045);
        filter: blur(10px);
        pointer-events: none;
        visibility: hidden;
      }

      /* Burst of Light Flash Overlay */
      .site-intro-flash {
        position: absolute;
        inset: -20%;
        background: radial-gradient(circle at center, rgba(255, 255, 255, 0.95) 0%, rgba(255, 45, 75, 0.6) 30%, transparent 68%);
        opacity: 0;
        pointer-events: none;
        z-index: 10;
      }

      #site-intro.is-bursting .site-intro-flash {
        animation: intro-flash-flare 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Cinematic Deep Space Ambient Glow */
      .site-intro-ambient {
        position: absolute;
        width: min(520px, 90vw);
        height: min(520px, 90vw);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(239, 68, 68, 0.28) 0%, rgba(220, 38, 38, 0.09) 45%, transparent 72%);
        filter: blur(42px);
        pointer-events: none;
        animation: intro-ambient-pulse 2.2s ease-in-out infinite alternate;
        transition: transform 0.4s ease, opacity 0.4s ease;
      }

      #site-intro.is-bursting .site-intro-ambient {
        transform: scale(1.6);
        opacity: 0.8;
      }

      html:not(.dark):not(.dark-theme) .site-intro-ambient {
        background: radial-gradient(circle, rgba(239, 68, 68, 0.18) 0%, rgba(220, 38, 38, 0.05) 45%, transparent 72%);
      }

      /* Holographic Shockwave & Ring */
      .site-intro-shockwave {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 2px solid rgba(255, 60, 80, 0.75);
        box-shadow: 0 0 28px rgba(255, 0, 50, 0.5);
        opacity: 0;
        pointer-events: none;
        animation: intro-shockwave 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) 0.42s forwards;
      }

      #site-intro.is-bursting .site-intro-shockwave {
        animation: intro-shockwave-burst 0.5s ease-out forwards;
      }

      .site-intro-ring {
        position: absolute;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.14);
        opacity: 0;
        pointer-events: none;
        animation: intro-ring-spin 6s linear infinite, intro-ring-fade 1.6s ease-out 0.3s forwards;
      }

      html:not(.dark):not(.dark-theme) .site-intro-ring {
        border-color: rgba(0, 0, 0, 0.08);
      }

      /* High-Intensity Laser Line (Blazing Photon Beam) */
      .site-intro-line {
        position: absolute;
        width: 0;
        height: 9px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent 0%, #ff3b53 18%, #ffffff 50%, #ff3b53 82%, transparent 100%);
        box-shadow: 0 0 16px #ff0033, 0 0 36px rgba(255, 0, 50, 0.8), 0 0 80px rgba(255, 0, 50, 0.5);
        animation: intro-laser 880ms cubic-bezier(0.2, 0.85, 0.25, 1) both;
        z-index: 1;
      }

      /* Center Mark Cluster: Badge + Name */
      .site-intro-mark {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #site-intro.is-bursting .site-intro-mark {
        transform: scale(1.08);
      }

      /* Volumetric 3D Beveled Red Play Badge */
      .site-intro-icon {
        width: 96px;
        height: 67px;
        flex: 0 0 96px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: linear-gradient(135deg, #ff2a44 0%, #e60023 55%, #b30016 100%);
        color: #ffffff;
        box-shadow: 0 18px 46px -8px rgba(230, 0, 35, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.28) inset, 0 6px 18px rgba(0, 0, 0, 0.45);
        position: relative;
        overflow: hidden;
        opacity: 0;
        transform: scale(0.3) perspective(600px) rotateX(15deg);
        animation: intro-logo 680ms cubic-bezier(0.34, 1.56, 0.64, 1) 0.42s forwards;
      }

      /* Specular Gloss Sheen that sweeps across badge */
      .site-intro-gloss {
        position: absolute;
        top: -50%;
        left: -80%;
        width: 60%;
        height: 200%;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.7) 50%, transparent 100%);
        transform: rotate(25deg);
        pointer-events: none;
        opacity: 0;
        animation: intro-gloss-sweep 850ms ease-out 0.92s forwards;
      }

      .site-intro-play-svg {
        width: 38px;
        height: 38px;
        margin-left: 4px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
        position: relative;
        z-index: 1;
      }

      /* Kinetic Typography Name Expansion */
      .site-intro-name {
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        max-width: 0;
        margin-left: 0;
        overflow: hidden;
        opacity: 0;
        white-space: nowrap;
        transform: translateX(-24px) scale(0.88);
        transform-origin: left center;
        animation: intro-name-reveal 720ms cubic-bezier(0.16, 1, 0.3, 1) 0.82s forwards;
      }

      .site-intro-title {
        display: flex;
        align-items: baseline;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -2.4px;
        line-height: 1;
      }

      .site-intro-zero {
        color: inherit;
        font-weight: 950;
      }

      .site-intro-tube {
        background: linear-gradient(135deg, #ff334b 0%, #e60023 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(230, 0, 35, 0.45);
        margin-left: 1px;
      }

      /* Clean Unboxed Editorial Metadata Kicker */
      .site-intro-sub {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 2.8px;
        text-transform: uppercase;
        color: #a1a1aa;
        margin-top: 5px;
        padding-left: 2px;
        opacity: 0;
        animation: intro-sub-fade 600ms ease-out 1.05s forwards;
      }

      html:not(.dark):not(.dark-theme) .site-intro-sub {
        color: #71717a;
      }

      .site-intro-sub-dot {
        opacity: 0.5;
        font-size: 12px;
      }


      /* Animations */
      @keyframes intro-ambient-pulse {
        0% { transform: scale(0.92); opacity: 0.7; }
        100% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes intro-laser {
        0% { width: 0; opacity: 0; transform: scaleY(0.35); }
        16% { opacity: 1; }
        56% { width: min(560px, 82vw); opacity: 1; transform: scaleY(1); }
        86% { width: 96px; opacity: 0.9; transform: scaleY(3.6); }
        100% { width: 96px; opacity: 0; transform: scaleY(6.8); }
      }

      @keyframes intro-logo {
        0% { opacity: 0; transform: scale(0.32) perspective(600px) rotateX(15deg); }
        58% { opacity: 1; transform: scale(1.14) perspective(600px) rotateX(-4deg); }
        80% { transform: scale(0.97) perspective(600px) rotateX(2deg); }
        100% { opacity: 1; transform: scale(1) perspective(600px) rotateX(0deg); }
      }

      @keyframes intro-shockwave {
        0% { transform: scale(0.2); opacity: 0.95; }
        100% { transform: scale(3.2); opacity: 0; }
      }

      @keyframes intro-shockwave-burst {
        0% { transform: scale(1); opacity: 0.9; }
        100% { transform: scale(4.5); opacity: 0; }
      }

      @keyframes intro-ring-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes intro-ring-fade {
        0% { opacity: 0; }
        50% { opacity: 0.6; }
        100% { opacity: 0.2; }
      }

      @keyframes intro-gloss-sweep {
        0% { transform: translateX(-120%) rotate(25deg); opacity: 0; }
        30% { opacity: 0.7; }
        100% { transform: translateX(240%) rotate(25deg); opacity: 0; }
      }

      @keyframes intro-name-reveal {
        0% { max-width: 0; margin-left: 0; opacity: 0; transform: translateX(-24px) scale(0.88); }
        42% { opacity: 1; }
        100% { max-width: 440px; margin-left: 20px; opacity: 1; transform: translateX(0) scale(1); }
      }

      @keyframes intro-sub-fade {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes intro-flash-flare {
        0% { opacity: 0; transform: scale(0.6); }
        35% { opacity: 0.95; transform: scale(1.15); }
        100% { opacity: 0; transform: scale(1.45); }
      }

      @keyframes intro-burst-exit {
        0% { opacity: 1; transform: scale(1); filter: blur(0px); }
        40% { opacity: 0.9; transform: scale(1.02); filter: blur(2px); }
        100% { opacity: 0; transform: scale(1.06); filter: blur(10px); }
      }

      /* Mobile Responsive Tweaks */
      @media (max-width: 580px) {
        .site-intro-icon {
          width: 76px;
          height: 54px;
          flex-basis: 76px;
          border-radius: 16px;
        }
        .site-intro-play-svg {
          width: 30px;
          height: 30px;
          margin-left: 3px;
        }
        .site-intro-title {
          font-size: 38px;
          letter-spacing: -1.8px;
        }
        .site-intro-sub {
          font-size: 8.5px;
          letter-spacing: 1.8px;
        }
        .site-intro-name {
          animation-name: intro-name-reveal-mobile;
        }
        @keyframes intro-name-reveal-mobile {
          0% { max-width: 0; margin-left: 0; opacity: 0; transform: translateX(-18px) scale(0.88); }
          42% { opacity: 1; }
          100% { max-width: 300px; margin-left: 14px; opacity: 1; transform: translateX(0) scale(1); }
        }
      }

      /* Reduced motion accessibility */
      @media (prefers-reduced-motion: reduce) {
        #site-intro, .site-intro-line, .site-intro-icon, .site-intro-name, .site-intro-ambient, .site-intro-shockwave, .site-intro-ring, .site-intro-gloss {
          transition: none !important;
          animation: none !important;
        }
        .site-intro-line, .site-intro-shockwave, .site-intro-ring, .site-intro-flash { display: none !important; }
        .site-intro-icon { opacity: 1 !important; transform: none !important; }
        .site-intro-name { max-width: 440px !important; margin-left: 20px !important; opacity: 1 !important; transform: none !important; }
        .site-intro-sub { opacity: 1 !important; }
      }
    </style>

  <body class="bg-[#0f0f0f] text-neutral-100 transition-colors">
    <!-- Cinematic Startup Intro (YouTube Pro Style + Burst Sync) -->
    <div id="site-intro" role="status" aria-label="zero-tube を起動中">
      <div class="site-intro-flash" aria-hidden="true"></div>
      <div class="site-intro-ambient" aria-hidden="true"></div>
      <div class="site-intro-shockwave" aria-hidden="true"></div>
      <div class="site-intro-ring" aria-hidden="true"></div>
      <span class="site-intro-line" aria-hidden="true"></span>
      <div class="site-intro-mark">
        <div class="site-intro-icon">
          <span class="site-intro-gloss" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" class="site-intro-play-svg" aria-hidden="true">
            <path d="M8 5v14l11-7z" fill="currentColor" />
          </svg>
        </div>
        <div class="site-intro-name">
          <div class="site-intro-title">
            <span class="site-intro-zero">zero</span><span class="site-intro-tube">-tube</span>
          </div>
          <div class="site-intro-sub">
            <span>NEXT-GEN CLIENT</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Pre-rendered Startup Sound for immediate HTML5 Audio autoplay fallback -->
    <audio id="startup-audio" src="/assets/startup-sound.wav" preload="auto" playsinline style="display:none;"></audio>

    <!-- App Root Container -->
    <div id="root"></div>

    <!-- Startup Synth Sound Engine & Background Sync Controller Script -->
    <script>
      (function() {
        var introStartTime = Date.now();
        var minIntroDuration = 1350; // Minimum time for the aesthetic logo bloom to unfold (1.35s)
        var maxSafetyTimeout = 3200; // Safety cap: never stall the user more than 3.2s
        var siteIntroClosing = false;
        var dataIsReady = false;
        var safetyTimer = null;

        // Ensure startup sound is never accidentally muted by default
        try {
          if (localStorage.getItem('kaito_startup_sound') === 'muted') {
            localStorage.removeItem('kaito_startup_sound');
          }
          if (localStorage.getItem('zero_startup_sound') === 'muted') {
            localStorage.removeItem('zero_startup_sound');
          }
        } catch (_) {}

        // ========================================================
        // 1. Dual Audio Engine (HTML5 Audio + Web Audio Synthesizer)
        // Autoplays seamlessly on launch without requiring a tap!
        // ========================================================
        var sharedAudioCtx = null;
        var hasPlayedStartupSound = false;
        var isAudioRendering = false;

        function getAudioContext() {
          if (!sharedAudioCtx) {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              sharedAudioCtx = new AudioCtx();
            }
          }
          return sharedAudioCtx;
        }

        // Part 1: Web Audio Synthesis Engine
        function renderAndPlaySynthSound(ctx) {
          if (hasPlayedStartupSound || isAudioRendering) return;
          hasPlayedStartupSound = true;
          isAudioRendering = true;
          removeUnlockListeners();

          // Stop fallback HTML5 audio if playing to avoid duplicate
          var html5Audio = document.getElementById('startup-audio');
          if (html5Audio && !html5Audio.paused) {
            try { html5Audio.pause(); } catch (_) {}
          }

          try {
            var startTime = ctx.currentTime + 0.03;

            // Master Gain
            var master = ctx.createGain();
            master.gain.setValueAtTime(0.88, startTime);
            master.connect(ctx.destination);

            // Part A: Laser Sweep Riser ("シュウウゥ...")
            var noiseDur = 0.42;
            var bufferSize = Math.floor(ctx.sampleRate * noiseDur);
            var noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var output = noiseBuffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              output[i] = Math.random() * 2 - 1;
            }
            var noise = ctx.createBufferSource();
            noise.buffer = noiseBuffer;

            var noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(140, startTime);
            noiseFilter.frequency.exponentialRampToValueAtTime(1400, startTime + 0.36);
            noiseFilter.Q.setValueAtTime(3.4, startTime);

            var noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.01, startTime);
            noiseGain.gain.linearRampToValueAtTime(0.42, startTime + 0.32);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.42);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(master);
            noise.start(startTime);

            // Part B: The Impact & Sub-Bass ("パァン！／ドォン")
            var impactTime = startTime + 0.42;

            // B-1: Heavy Sub-Bass Boom (150Hz -> 38Hz)
            var subOsc = ctx.createOscillator();
            var subGain = ctx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(150, impactTime);
            subOsc.frequency.exponentialRampToValueAtTime(38, impactTime + 0.85);
            subGain.gain.setValueAtTime(0.0001, startTime);
            subGain.gain.setValueAtTime(0.98, impactTime);
            subGain.gain.exponentialRampToValueAtTime(0.001, impactTime + 1.25);

            subOsc.connect(subGain);
            subGain.connect(master);
            subOsc.start(impactTime);
            subOsc.stop(impactTime + 1.3);

            // B-2: High-Transient Snap Strike ("パァン")
            var snapOsc = ctx.createOscillator();
            var snapGain = ctx.createGain();
            snapOsc.type = 'triangle';
            snapOsc.frequency.setValueAtTime(680, impactTime);
            snapOsc.frequency.exponentialRampToValueAtTime(75, impactTime + 0.08);
            snapGain.gain.setValueAtTime(0.0001, startTime);
            snapGain.gain.setValueAtTime(0.65, impactTime);
            snapGain.gain.exponentialRampToValueAtTime(0.001, impactTime + 0.09);

            snapOsc.connect(snapGain);
            snapGain.connect(master);
            snapOsc.start(impactTime);
            snapOsc.stop(impactTime + 0.1);

            // B-3: Cinematic Resonant Harmonic Tail (A4 & E5 chord shimmer)
            [440, 659.25, 880, 1318.5].forEach(function(freq, idx) {
              var harmOsc = ctx.createOscillator();
              var harmGain = ctx.createGain();
              harmOsc.type = 'sine';
              harmOsc.frequency.setValueAtTime(freq + (idx % 2 === 0 ? -1.5 : 1.5), impactTime);
              harmGain.gain.setValueAtTime(0.0001, startTime);
              harmGain.gain.setValueAtTime(0.24 / (idx + 1), impactTime);
              harmGain.gain.exponentialRampToValueAtTime(0.0005, impactTime + 1.5);

              harmOsc.connect(harmGain);
              harmGain.connect(master);
              harmOsc.start(impactTime);
              harmOsc.stop(impactTime + 1.6);
            });
          } catch (e) {
            console.warn('[zero-tube] Synth sound error:', e);
            hasPlayedStartupSound = false;
            isAudioRendering = false;
          }
        }

        // Part 2: Master AutoPlay Attempt (Tries both HTML5 Audio & Web Audio simultaneously)
        function tryAutoPlayStartupSound(force) {
          if (force) {
            hasPlayedStartupSound = false;
            isAudioRendering = false;
          }
          if (hasPlayedStartupSound) return;

          // Attempt 1: HTML5 Audio element
          var html5Audio = document.getElementById('startup-audio');
          if (html5Audio && !hasPlayedStartupSound) {
            html5Audio.volume = 0.95;
            var p = html5Audio.play();
            if (p !== undefined) {
              p.then(function() {
                hasPlayedStartupSound = true;
                removeUnlockListeners();
              }).catch(function(_) {});
            }
          }

          // Attempt 2: Web Audio API
          var ctx = getAudioContext();
          if (ctx && !hasPlayedStartupSound) {
            if (ctx.state === 'running') {
              renderAndPlaySynthSound(ctx);
            } else {
              ctx.resume().then(function() {
                if (ctx.state === 'running') {
                  renderAndPlaySynthSound(ctx);
                }
              }).catch(function(_) {});
            }
          }
        }

        window.playStartupSynthSound = tryAutoPlayStartupSound;

        // Auto-play immediately upon script evaluation and at rapid micro-intervals
        tryAutoPlayStartupSound();
        var autoTicks = [10, 30, 70, 150, 260, 450, 700, 1000];
        autoTicks.forEach(function(delay) {
          setTimeout(function() {
            if (!hasPlayedStartupSound) {
              tryAutoPlayStartupSound();
            }
          }, delay);
        });

        // Passive Non-Tap Listener: mouse movement, hover, trackpad, scroll, focus, visibility
        // As soon as the user moves mouse, scrolls, or window gains focus, audio starts immediately without any tap!
        function handlePassiveInteraction() {
          if (hasPlayedStartupSound) return;
          tryAutoPlayStartupSound();
        }

        var passiveEvents = [
          'mousemove', 'pointermove', 'mouseover', 'mouseenter', 'wheel', 'scroll',
          'touchmove', 'focus', 'visibilitychange', 'pageshow', 'keydown',
          'pointerdown', 'touchstart', 'mousedown', 'click'
        ];
        passiveEvents.forEach(function(evt) {
          window.addEventListener(evt, handlePassiveInteraction, { capture: true, passive: true });
          document.addEventListener(evt, handlePassiveInteraction, { capture: true, passive: true });
        });

        var introEl = document.getElementById('site-intro');
        if (introEl) {
          introEl.addEventListener('pointermove', handlePassiveInteraction, { passive: true });
          introEl.addEventListener('mousemove', handlePassiveInteraction, { passive: true });
          introEl.addEventListener('click', function(e) {
            if (!hasPlayedStartupSound) {
              handlePassiveInteraction();
            } else {
              triggerBurstExit();
            }
          });
        }

        function removeUnlockListeners() {
          passiveEvents.forEach(function(evt) {
            window.removeEventListener(evt, handlePassiveInteraction, true);
            document.removeEventListener(evt, handlePassiveInteraction, true);
          });
        }

        // ========================================================
        // 2. Burst of Light & Background Sync Exit Controller
        // ========================================================
        function triggerBurstExit() {
          var siteIntro = document.getElementById('site-intro');
          if (!siteIntro || siteIntroClosing) return;
          siteIntroClosing = true;
          if (safetyTimer) clearTimeout(safetyTimer);
          if (promptTimer) clearTimeout(promptTimer);

          // Add bursting light flash
          siteIntro.classList.add('is-bursting');

          setTimeout(function() {
            siteIntro.classList.add('is-hidden');
            setTimeout(function() {
              if (siteIntro && siteIntro.parentNode) {
                siteIntro.remove();
              }
            }, 500);
          }, 380);
        }

        window.finishSiteIntro = function() {
          triggerBurstExit();
        };

        // Called by React App once initial feed/trending API data has loaded!
        window.notifyInitialDataReady = function() {
          dataIsReady = true;
          var elapsed = Date.now() - introStartTime;
          if (elapsed >= minIntroDuration) {
            // Data is ready and minimum logo intro has blossomed: burst immediately!
            triggerBurstExit();
          } else {
            // Data is ready slightly early: schedule burst at the exact climax of the animation!
            setTimeout(function() {
              triggerBurstExit();
            }, minIntroDuration - elapsed);
          }
        };

        // Safety timeout: if API is slow or offline, burst after 3.2s
        safetyTimer = setTimeout(function() {
          triggerBurstExit();
        }, maxSafetyTimeout);

        window.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') {
            if (!hasPlayedStartupSound) {
              handleImmediateUserGesture(e);
            } else {
              triggerBurstExit();
            }
          }
        });

        // ========================================================
        // 3. Replay Function with Full Sound & Burst
        // ========================================================
        window.replaySiteIntro = function() {
          var existing = document.getElementById('site-intro');
          if (existing) existing.remove();

          var html = '<div class="site-intro-flash" aria-hidden="true"></div>' +
            '<div class="site-intro-ambient" aria-hidden="true"></div>' +
            '<div class="site-intro-shockwave" aria-hidden="true"></div>' +
            '<div class="site-intro-ring" aria-hidden="true"></div>' +
            '<span class="site-intro-line" aria-hidden="true"></span>' +
            '<div class="site-intro-mark">' +
              '<div class="site-intro-icon">' +
                '<span class="site-intro-gloss" aria-hidden="true"></span>' +
                '<svg viewBox="0 0 24 24" class="site-intro-play-svg" aria-hidden="true">' +
                  '<path d="M8 5v14l11-7z" fill="currentColor" />' +
                '</svg>' +
              '</div>' +
              '<div class="site-intro-name">' +
                '<div class="site-intro-title">' +
                  '<span class="site-intro-zero">zero</span><span class="site-intro-tube">-tube</span>' +
                '</div>' +
                '<div class="site-intro-sub">' +
                  '<span>NEXT-GEN CLIENT</span>' +
                '</div>' +
              '</div>' +
            '</div>';

          var overlay = document.createElement('div');
          overlay.id = 'site-intro';
          overlay.role = 'status';
          overlay.setAttribute('aria-label', 'zero-tube 起動アニメーション');
          overlay.innerHTML = html;
          document.body.appendChild(overlay);

          siteIntroClosing = false;
          introStartTime = Date.now();

          // Force play synth audio on explicit replay
          window.playStartupSynthSound(true);

          overlay.addEventListener('click', function() {
            triggerBurstExit();
          });

          setTimeout(function() {
            triggerBurstExit();
          }, 2400);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
